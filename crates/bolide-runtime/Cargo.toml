[package]
name = "bolide-runtime"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
num-bigint.workspace = true
num-traits.workspace = true
rust_decimal.workspace = true
once_cell.workspace = true
rustc-hash.workspace = true
regex.workspace = true
libloading = "0.8"
mio = { version = "1", features = ["net", "os-poll"] }
socket2 = "0.5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = { version = "0.30", default-features = false }
rusqlite = { version = "0.35", features = ["bundled"] }
flate2 = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
native-tls = "0.2"

# Android NDK does not ship a pkg-config discoverable OpenSSL.  Keep TLS
# available for Bolide programs by building it from source for this target.
[target.'cfg(target_os = "android")'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
